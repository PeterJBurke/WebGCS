[tool:pytest]
# pytest configuration for WebGCS test suite

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers for test categorization
markers =
    mavlink: MAVLink protocol tests (Phase 1)
    web: Web interface tests (Phase 2)  
    performance: Performance validation tests (Phase 3)
    safety: Safety-critical tests (Phase 4)
    integration: End-to-end integration tests (Phase 4)
    unit: Unit tests
    slow: Tests that take more than 10 seconds
    
# Test timeouts (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Performance test configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning